name: Check Apple Stock

on:
  schedule:
    # Every 30 minutes. GitHub Actions cron runs in UTC and is best-effort --
    # during busy periods it can fire a few minutes late.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed so the workflow can commit the updated state.json

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        run: python check_stock.py
        env:
          STOCK_ZIP: "94402"
          NTFY_URL: "https://ntfy.sh/apple-stock-94402-alerts-2"

      - name: Commit updated state (if changed)
        run: |
          git config user.name "apple-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update stock state [skip ci]"
          git push
